name: GeneralStore

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Appium + driver
        run: |
          echo "📦 Installing Appium and drivers..."
          npm install -g --unsafe-perm appium wait-on
          npx appium driver install uiautomator2
          echo "✅ Appium installation completed"

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save
          disable-animations: true
          emulator-boot-timeout: 1200
          script: |
            echo "🔧 Setting up environment variables..."
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
            echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
            
            echo "📱 Additional emulator stabilization..."
            sleep 45
            adb devices
            adb shell getprop sys.boot_completed
            adb shell input keyevent 82
            sleep 15
            
            # Зберігаємо PID емулятора для подальшого ручного керування
            EMULATOR_PID=$(ps aux | grep -i emulator | grep -v grep | awk '{print $2}')
            echo "EMULATOR_PID=$EMULATOR_PID" >> $GITHUB_ENV

      - name: Run Appium and Tests
        run: |
          echo "🚀 Starting Appium server..."
          # Використовуємо правильний базовий шлях
          nohup npx appium --base-path / --session-override --relaxed-security --log-level debug > appium.log 2>&1 &
          APPIUM_PID=$!
    
          echo "⏳ Waiting for Appium to start..."
          npx wait-on tcp:4723 --timeout=60000
          if [ $? -ne 0 ]; then
            echo "❌ Appium failed to start within 60 seconds"
            cat appium.log
            exit 1
          fi

          echo "✅ Verifying Appium connectivity..."
          # Перевіряємо правильний ендпоінт
          curl -f http://localhost:4723/ || {
            echo "❌ Appium not responding correctly"
            cat appium.log
            exit 1
          }

          # Альтернативна перевірка статусу
          echo "📊 Appium status:"
          curl -s http://localhost:4723/status | jq . || curl -s http://localhost:4723/status

          echo "🔨 Building project..."
          dotnet restore
          dotnet build --configuration Release

          echo "🧪 Running NUnit tests with increased timeout..."
          dotnet test ./GeneralStore.sln \
            --configuration Release \
            --logger "trx;LogFileName=test_results.trx" \
            -- TestRunTimeout=600000

          echo "🛑 Stopping Appium..."
          kill $APPIUM_PID 2>/dev/null || true

      - name: Stop Emulator
        if: always()
        run: |
          echo "🛑 Stopping emulator..."
          adb emu kill || true
          # Альтернативний спосіб зупинки
          if [ -n "$EMULATOR_PID" ]; then
            kill $EMULATOR_PID 2>/dev/null || true
          fi
          sleep 5

      - name: Upload diagnostics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            appium.log
            **/test_results.trx
            **/TestResults/*

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: NUnit Tests
          path: "**/test_results.trx"
          reporter: dotnet-trx

      - name: Check test results
        if: always()
        run: |
          if ls **/test_results.trx 1> /dev/null 2>&1; then
            echo "📊 Test results generated successfully"
          else
            echo "❌ No test results found"
            exit 1
          fi