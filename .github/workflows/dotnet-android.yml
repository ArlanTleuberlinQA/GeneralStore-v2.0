name: GeneralStore

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache NPM
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Android SDK
        uses: actions/cache@v3
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/system-images
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('**/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      - name: Cache AVD
        uses: actions/cache@v3
        with:
          path: ~/.android/avd
          key: ${{ runner.os }}-avd-${{ hashFiles('**/build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-avd-

      - name: Upload diagnostics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            appium.log
            logcat.txt
            **/test_results.trx
            **/TestResults/*

      - name: Install Appium + driver
        run: |
          echo "📦 Installing Appium and drivers..."
          npm install -g --unsafe-perm appium wait-on
          npx appium driver install uiautomator2
          echo "✅ Appium installation completed"

      - name: Start Emulator, Appium and Run Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_3a
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save -gpu swiftshader_indirect
          disable-animations: true
          emulator-boot-timeout: 1200
          script: |
            echo "🔧 Setting up environment..."
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
            echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
            
            echo "📱 Additional emulator stabilization..."
            sleep 45
            adb devices
            adb shell getprop sys.boot_completed
            adb shell input keyevent 82
            sleep 15

            echo "📋 Starting logcat capture..."
            adb logcat -c  # Очистити лог
            adb logcat > logcat.txt &
            LOGCAT_PID=$!


            echo "🚀 Starting Appium server..."
            nohup npx appium --base-path /wd/hub --session-override --relaxed-security --log-level debug > appium.log 2>&1 &
            APPIUM_PID=$!
            
            echo "⏳ Waiting for Appium to start..."
            npx wait-on tcp:4723 --timeout=60000

            echo "🔨 Building project..."
            dotnet restore
            dotnet build --configuration Release

            echo "🧪 Running NUnit tests..."
            dotnet test ./GeneralStore.sln --configuration Release --logger trx

            echo "🛑 Stopping Appium..."
            kill $APPIUM_PID 2>/dev/null || true

      - name: Upload diagnostics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            appium.log
            **/test_results.trx
            **/TestResults/*

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: NUnit Tests
          path: "**/test_results.trx"
          reporter: dotnet-trx

      - name: Check test results
        if: always()
        run: |
          if ls **/test_results.trx 1> /dev/null 2>&1; then
            echo "📊 Test results generated successfully"
          else
            echo "❌ No test results found"
            exit 1
          fi