name: GeneralStore

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  android-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache NPM
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Appium + driver
        run: |
          echo "📦 Installing Appium and drivers..."
          npm install -g --unsafe-perm appium wait-on
          npx appium driver install uiautomator2
          echo "✅ Appium installation completed"

      - name: Start Android Emulator and run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save
          disable-animations: true
          emulator-boot-timeout: 1200
          script: |
            echo "🔧 Setting up environment variables..."
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
            echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
            echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
            echo "$JAVA_HOME_17_X64/bin" >> $GITHUB_PATH

            echo "📱 Additional emulator stabilization..."
            sleep 30
            adb devices
            adb shell getprop sys.boot_completed
            adb shell input keyevent 82
            sleep 10

            echo "🚀 Starting Appium server..."
            nohup npx appium --base-path /wd/hub --session-override --relaxed-security --log-level debug > appium.log 2>&1 &
            APPIUM_PID=$!
            
            echo "⏳ Waiting for Appium to start..."
            timeout 60 npx wait-on tcp:4723 || {
              echo "❌ Appium failed to start within 60 seconds"
              cat appium.log
              exit 1
            }

            echo "✅ Verifying Appium connectivity..."
            curl -f http://localhost:4723/wd/hub/sessions || {
              echo "❌ Appium not responding correctly"
              cat appium.log
              exit 1
            }

            echo "🔨 Building project..."
            dotnet restore
            dotnet build --configuration Release

            echo "🧪 Running NUnit tests with increased timeout..."
            dotnet test ./GeneralStore.sln \
              --configuration Release \
              --logger "trx;LogFileName=test_results.trx" \
              -- TestRunTimeout=300000

            echo "🛑 Stopping Appium..."
            kill $APPIUM_PID 2>/dev/null || true

      - name: Upload diagnostics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            appium.log
            **/test_results.trx
            **/TestResults/*

      - name: Publish Test Results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: NUnit Tests
          path: "**/test_results.trx"
          reporter: dotnet-trx

      - name: Check test results
        if: always()
        run: |
          if [ -f "**/test_results.trx" ]; then
            echo "📊 Test results generated successfully"
          else
            echo "❌ No test results found"
            exit 1
          fi